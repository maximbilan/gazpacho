[project]
name = "gazpacho"
version = "0.1.0"
description = "Personal Telegram digest bot for Spanish school updates, summarized in Ukrainian."
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.34.0",
    "httpx>=0.27.0",
    "openai>=1.99.0",
    "pydantic>=2.8.0",
    "qrcode>=7.4.0",
    "telethon>=1.36.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "ruff>=0.6.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
