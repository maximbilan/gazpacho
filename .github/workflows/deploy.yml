name: Deploy

on:
  workflow_dispatch:
    inputs:
      stack_name:
        description: CloudFormation stack name
        default: gazpacho
        required: true
      environment_name:
        description: Deployment environment name
        default: prod
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Deploy SAM stack
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.environment_name }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up SAM
        uses: aws-actions/setup-sam@v2

      - name: Configure AWS credentials with OIDC
        if: ${{ vars.AWS_ROLE_TO_ASSUME != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION || 'eu-west-1' }}

      - name: Configure AWS credentials with access keys
        if: ${{ vars.AWS_ROLE_TO_ASSUME == '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'eu-west-1' }}

      - name: Build SAM app
        run: sam build --template-file infra/template.yaml

      - name: Deploy SAM app
        env:
          AWS_REGION: ${{ vars.AWS_REGION || 'eu-west-1' }}
          SOURCE_CHAT_IDS: ${{ vars.SOURCE_CHAT_IDS }}
          TARGET_CHAT_IDS: ${{ vars.TARGET_CHAT_IDS || vars.TARGET_CHAT_ID }}
          SCHEDULE_MINUTE: ${{ vars.SCHEDULE_MINUTE || '0' }}
          SCHEDULE_HOUR: ${{ vars.SCHEDULE_HOUR || '18' }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'openai' }}
          LLM_MODEL_SUMMARY: ${{ vars.LLM_MODEL_SUMMARY || 'gpt-4.1-mini' }}
          LLM_MODEL_QA: ${{ vars.LLM_MODEL_QA || 'gpt-5-mini' }}
          SECRETS_MANAGER_SECRET_ID: ${{ vars.SECRETS_MANAGER_SECRET_ID || 'gazpacho/secrets' }}
          DYNAMODB_TABLE_NAME: ${{ vars.DYNAMODB_TABLE_NAME || 'gazpacho' }}
          SCHEDULED_DIGEST_FUNCTION_NAME: ${{ vars.SCHEDULED_DIGEST_FUNCTION_NAME || 'gazpacho-scheduled-digest' }}
        run: |
          sam deploy \
            --template-file .aws-sam/build/template.yaml \
            --stack-name "${{ inputs.stack_name }}" \
            --region "$AWS_REGION" \
            --capabilities CAPABILITY_IAM \
            --resolve-s3 \
            --resolve-image-repos \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              "ParameterKey=EnvironmentName,ParameterValue=${{ inputs.environment_name }}" \
              "ParameterKey=ScheduledDigestFunctionName,ParameterValue=$SCHEDULED_DIGEST_FUNCTION_NAME" \
              "ParameterKey=SourceChatIds,ParameterValue=$SOURCE_CHAT_IDS" \
              "ParameterKey=TargetChatIds,ParameterValue=$TARGET_CHAT_IDS" \
              "ParameterKey=ScheduleMinute,ParameterValue=$SCHEDULE_MINUTE" \
              "ParameterKey=ScheduleHour,ParameterValue=$SCHEDULE_HOUR" \
              "ParameterKey=LlmProvider,ParameterValue=$LLM_PROVIDER" \
              "ParameterKey=LlmModelSummary,ParameterValue=$LLM_MODEL_SUMMARY" \
              "ParameterKey=LlmModelQa,ParameterValue=$LLM_MODEL_QA" \
              "ParameterKey=SecretsManagerSecretId,ParameterValue=$SECRETS_MANAGER_SECRET_ID" \
              "ParameterKey=DynamoDbTableName,ParameterValue=$DYNAMODB_TABLE_NAME"
